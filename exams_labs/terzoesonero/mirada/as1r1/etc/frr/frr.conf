!
password zebra
enable password zebra
!
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 1
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 2.2.2.2 remote-as 1
    neighbor 2.2.2.2 update-source 1.1.1.1
    neighbor 10.20.0.2 remote-as 2
    !
    ! NETWORKS
    !
    network 1.0.0.0/8
    network 10.20.0.0/30
    !
    ! POLICIES
    ! in=annuncia, out=accetta
    neighbor 2.2.2.2 prefix-list defaultRoute in
    neighbor 2.2.2.2 prefix-list defaultRoute out

    neighbor 10.20.0.2 prefix-list defaultRoute in
    neighbor 10.20.0.2 prefix-list defaultRoute out
    
    neighbor 10.20.0.2 route-map trafficToD out

    route-map trafficToD permit 10
        set metric 20
    !
    ip prefix-list defaultRoute permit any
!
!
! FRRouting configuration file
!
!
!  RIP CONFIGURATION
!
router rip
!send rip multicast packets to interfaces falling into this prefix
network 1.0.0.0/8
redistribute bgp
redistribute connected
!
log file /var/log/frr/frr.log