!
password zebra
enable password zebra
!
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 300
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 200.150.1.1 remote-as 200
    neighbor 200.150.2.1 remote-as 200
    !
    ! NETWORKS
    !
    network 200.150.1.0/30
    network 200.150.2.0/30
    network 150.0.0.0/24    
    !
    ! POLICIES
    ! in=annuncia, out=accetta
    neighbor 200.150.1.1 prefix-list defaultRoute in
    neighbor 200.150.1.1 prefix-list defaultRoute out

    neighbor 200.150.2.1 prefix-list defaultRoute in
    neighbor 200.150.2.1 prefix-list defaultRoute out
    neighbor 200.150.2.1 route-map as200r4In in
    !
    route-map as200r4In permit 10
        set local-preference 150
    ip prefix-list defaultRoute permit any
!
log file /var/log/frr/frr.log
