!
password zebra
enable password zebra
!
!
!  BGP CONFIGURATION
!
debug bgp keepalives
debug bgp updates in
debug bgp updates out
!
router bgp 100
    no bgp network import-check
    !
    ! NEIGHBORS
    !
    neighbor 100.200.2.2 remote-as 200
    neighbor 100.200.1.2 remote-as 200
    !
    ! NETWORKS
    !
    network 100.200.1.0/30
    network 100.200.2.0/30
    network 100.0.0.0/24
    !
    ! POLICIES
    ! in=annuncia, out=accetta
    neighbor 100.200.1.2 prefix-list defaultRoute in
    neighbor 100.200.1.2 prefix-list defaultRoute out
    
    neighbor 100.200.2.2 prefix-list defaultRoute in
    neighbor 100.200.2.2 prefix-list defaultRoute out
    !
    ip prefix-list defaultRoute permit any

    neighbor 100.200.1.2 route-map trafficToD out
    route-map trafficToD permit 10
        set metric 20
!
log file /var/log/frr/frr.log
